<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>LifePilot（スマホ版）</title>
<style>
:root{--bg:#06140e;--card:#0f3325;--line:#2a5a47;--text:#e6f2ea;--sub:#a9c7b8;--accent:#d4a63a}
*{box-sizing:border-box} body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;background:var(--bg);color:var(--text);padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px 16px 0} h1{font-size:19px;margin:6px 0 10px} h2{font-size:15px;margin:18px 0 6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav{overflow-x:auto} nav button{flex:1 0 auto;min-width:72px;border:none;background:none;padding:12px 2px;font-size:12px;color:var(--sub)} nav button.今{color:var(--text);font-weight:bold;border-top:3px solid var(--accent);margin-top:-1px}
.カード{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:10px;background:var(--card)} .一手{font-size:21px;font-weight:bold;margin:0 0 6px}
button.押す,.行ボタン button{padding:10px 16px;font-size:15px;border:1px solid #888;border-radius:8px;background:#fff;margin:4px 6px 4px 0} button.濃{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select,textarea{width:100%;padding:9px;font-size:16px;border:1px solid #aaa;border-radius:8px;background:#fff;margin-top:3px} textarea{height:100px} label{display:block;margin-top:12px;font-size:13px;color:var(--sub)}
.小{font-size:12px;color:var(--sub)} .エラー{color:#b00020} .完了{color:#2a6b2a} .行ボタン{display:flex;flex-wrap:wrap} .選択 button{padding:9px 14px;font-size:15px;margin:3px 5px 3px 0;border:1px solid #888;border-radius:8px;background:#fff} .選択 button.選ばれ{background:var(--accent);color:#fff}
.時間{font-size:60px;font-weight:bold;font-variant-numeric:tabular-nums;margin:6px 0} .タスク行{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
</style>
<link rel="stylesheet" href="テーマ.css?v=20261028b"></head><body class="lp lp-スマホ" data-地区="港">
<main id="本体"></main>
<nav id="タブ"></nav>
<script src="core.js?v=20261028b"></script><script src="絵_人物.js?v=20261028b"></script><script src="絵_街.js?v=20261028b"></script><script src="起動画面.js?v=20261028b"></script>
<script src="drive.js?v=20261028b"></script>
<script src="calendar.js?v=20261028b"></script>
<script>
// ================= データ（スマホの中に、持つ） =================
const L = LifePilot, $ = id => document.getElementById(id);
const 既定のクライアントID = "207746409667-k82tseegkc8ufkm9jj1ddam877mmj8tn.apps.googleusercontent.com";   // Google の「名前札」。秘密ではない
const 空データ = () => ({ tasks: [], deposits: [], state_logs: [], seals: [], suggestion_log: [], focus_log: [], memos: [], life_events: [], sleep_logs: [], warehouse_items: [], wishlist: [], duration_log: [], workout_logs: [], ai_requests: [], ai_replies: [], values: { 答え: {}, 今日はやめた: {} } });
let データ = 空データ(), 設定 = null, 画面 = (decodeURIComponent(location.hash.slice(1)) || "提案"), 時計 = null, 今の提案 = null, 今の空き = 0, 五分の記録 = null;
function 保存() { try { localStorage.setItem("lifepilot_data", JSON.stringify(データ)); } catch (e) { const 文 = "保存できませんでした（保存先がいっぱいか、使えない設定です）"; if ($("通知")) 出す(文, true); else alert(文); } }
function 読み込む() { try { const s = localStorage.getItem("lifepilot_data"); if (s) データ = Object.assign(空データ(), JSON.parse(s)); } catch (e) { try { localStorage.setItem("lifepilot_data_broken", localStorage.getItem("lifepilot_data")); } catch (e2) {} データ = 空データ(); alert("記録が読めませんでした。壊れた記録は lifepilot_data_broken に残しました"); } }
async function 設定を読む() {
  try { const s = localStorage.getItem("lifepilot_settings"); if (s) { 設定 = JSON.parse(s); return; } } catch (e) {}
  設定 = await (await fetch("初期設定.json")).json();            // 個人のデータは入っていない、初めの設定
}
async function エルピーの設定を補う() {          // 古い設定（新しい項目がない）の時は、初めの設定から、足りない項目だけ足す
  const 要る = ["エルピー", "倉庫", "相場帳", "分解", "カレンダー", "通信", "実験室", "街", "コーチ", "自由コーチ", "見た目"];
  const 揃う = () => 要る.every(k => 設定[k]) && (設定.コーチ || {}).最初の一手 && 設定.通信 && 設定.通信.節目.筋トレ && 設定.街 && 設定.街.一言.筋トレ && 設定.見た目;
  if (揃う()) return;
  try { const 初 = await (await fetch("初期設定.json")).json(); for (const k of 要る) if (!設定[k] && 初[k]) 設定[k] = 初[k]; if (設定.コーチ && !設定.コーチ.最初の一手 && 初.コーチ) 設定.コーチ.最初の一手 = 初.コーチ.最初の一手;
    for (const k of ["筋トレ", "筋トレの間"]) if (設定.通信 && !設定.通信.節目[k]) 設定.通信.節目[k] = 初.通信.節目[k];
    if (設定.街 && !設定.街.一言.筋トレ) 設定.街.一言.筋トレ = 初.街.一言.筋トレ; } catch (e) {}
}
const 言 = k => (設定.整備室.表示の言葉 || {})[k] || k;
function このスマホの動き() { try { return localStorage.getItem("lifepilot_motion") || ""; } catch (e) { return ""; } }
function 動きを当てる() {          // 背景の動き（多い／少ない／なし）。テーマ.css の 14b が見る
  const v = このスマホの動き() || ((設定 && 設定.見た目) || {}).背景の動き;
  document.body.dataset.動き = ["多い", "少ない", "なし"].includes(v) ? v : "多い";
}
function 出す(文, エラー) { const e = $("通知"); if (e) { e.className = エラー ? "エラー" : "完了"; e.textContent = 文; } }
const 安全 = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ================= 画面の切り替え =================
const 画面一覧 = [["提案", "今なにする？"], ["エルピー", "エルピー"], ["街", "街の地図"], ["筋トレ", "筋トレ"], ["使った", "使った機能"], ["タスク", "タスク"], ["カレンダー", "カレンダー"], ["メモ", "メモ"], ["預ける", "預ける"], ["引く", "記録を引く"], ["夜", "明日何やる？"], ["ニュース", "ニュース"], ["倉庫", "倉庫"], ["通信", "通信"], ["実験室", "実験室"], ["状態", "体と気分"], ["同期", "同期"]];
function 描く() {
  clearInterval(時計);
  $("タブ").innerHTML = 画面一覧.map(([k, 名]) => `<button class="${k === 画面 ? "今" : ""}" onclick="移る('${k}')">${名}${k === "通信" && 未読の数() ? "（" + 未読の数() + "）" : ""}</button>`).join("");
  ({ 提案: 提案画面, エルピー: エルピー画面, 街: 街画面, 筋トレ: 筋トレ画面, 使った: 使った機能画面, タスク: () => タスク画面(), カレンダー: カレンダー画面, メモ: メモ画面, 預ける: 預ける画面, 引く: 引く画面, 夜: 夜画面, ニュース: ニュース画面, 倉庫: 倉庫画面, 通信: 通信画面, 実験室: 実験室画面, 状態: 状態画面, 同期: 同期画面 })[画面]();
  const 本 = $("本体"); 本.classList.remove("n-現れる"); void 本.offsetWidth; 本.classList.add("n-現れる");   // タブを替えた時だけ、現れ方の動き（見た目の型 13節）
  setTimeout(() => { 本.classList.remove("n-現れる"); if (!本.className) 本.removeAttribute("class"); }, 800);
}
let 同期中 = false;
function 移る(k) { if (同期中) return 出す("同期が終わるまで、お待ちください", true); if (五分の記録 && 時計 && !confirm("5分だけの途中です。移ると、計るのが止まります。移りますか")) return; 画面 = k; 描く(); }

// ================= エルピー（生活の点数と、睡眠のアンケート） =================
let 答え直し = false;
function エルピー画面() {
  L.開く(データ); 保存();                                     // ログイン・昨日までの放置・締切切れ（何度でも同じ）
  const s = L.生活の状態(データ, 設定), e = 設定.エルピー, g = e.生活, t = s.今日;
  const 位置 = (s.点数 - e.点数.下限) / (e.点数.上限 - e.点数.下限) * 100, 答え済み = !s.睡眠の質問;
  const 選択 = [[3, "3時間以下"], [4, "4時間"], [5, "5時間"], [6, "6時間"], [7, "7時間"], [8, "8時間"], [9, "9時間"], [10, "10時間以上"]];
  $("本体").innerHTML = `<h1>エルピー</h1><div id="エルピーの絵" style="max-width:420px;margin:0 auto"></div>
    <div class="カード"><div style="font-size:34px;font-weight:bold">${s.点数 >= 0 ? "+" : ""}${s.点数}　<span style="font-size:20px">${安全(s.顔)}</span></div>
      <div style="position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#C62E3A,#1F5FBF 50%,#F2C94C);margin:12px 0 4px"><i style="position:absolute;top:-4px;width:4px;height:22px;background:#222;border-radius:2px;left:calc(${位置}% - 2px)"></i></div>
      <div class="小" style="display:flex;justify-content:space-between"><span>${e.点数.下限}</span><span>0</span><span>${e.点数.上限}</span></div>
      <p class="小">気分の点数。達成・放置・締切・ログインなどで動き、日をまたいで積み上がります。</p></div>
    <div class="カード"><b>疲れ ${s.疲れ}</b>
      <div style="height:10px;border-radius:5px;background:#ddd;margin:8px 0"><div style="height:10px;border-radius:5px;background:#777;width:${s.疲れ}%"></div></div>
      <div class="小">${安全(s.疲れの説明)}</div>
      ${答え済み && !答え直し ? `<p>今日の睡眠：${s.今日の睡眠 === null ? "わからない" : s.今日の睡眠 + "時間"}　<button class="押す" id="直す">答え直す</button></p>` : `<p><b>昨夜は何時間ねましたか？</b></p><div class="選択" id="睡眠">${選択.map(([h, 名]) => `<button data-h="${h}">${名}</button>`).join("")}<button data-h="">わからない</button></div>`}</div>
    <div class="カード"><b>今日の加点</b><div class="小">達成 ${t.達成}/${g.達成.上限}、5分 ${t.五分}/${g.五分.上限}、気分じゃない ${t.気分じゃない}/${g.気分じゃない.回数}回、会話 ${t.会話}/${g.会話の上限}、ログイン ${t.ログイン ? "済" : "未"}</div></div>
    <h2>点数が動いた理由</h2><div class="カード" id="履歴"></div><span id="通知"></span>`;
  $("履歴").innerHTML = s.履歴.length ? "" : '<span class="小">まだ、ありません</span>';
  for (const r of s.履歴) { const d = document.createElement("div"); d.className = "小"; d.textContent = r.日付.slice(5) + "　" + (r.点 > 0 ? "+" : "") + r.点 + "　" + r.理由; $("履歴").appendChild(d); }
  if (window.LifePilotArt人物) $("エルピーの絵").innerHTML = LifePilotArt人物.エルピーを描く({ 点: s.点数, 疲れ: s.疲れ, 接頭辞: "elp", 明るい背景: true, 計器: false, 画像: true });
  if ($("直す")) $("直す").onclick = () => { 答え直し = true; エルピー画面(); };
  if ($("睡眠")) $("睡眠").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; try { L.睡眠を答える(データ, b.dataset.h === "" ? null : Number(b.dataset.h)); 保存(); 答え直し = false; エルピー画面(); } catch (x) { 出す(x.message, true); } };
}

// ================= 状態（体・気分・電池） =================
function 状態画面() {
  const s = 設定.土台2, 現在 = L.使える状態(データ, 設定), 刻む = k => Array.from({ length: 100 / k + 1 }, (_, i) => i * k);
  const 選ぶ = { 体: 現在 ? 現在.体 : null, 気分: 現在 ? 現在.気分 : null, 電池: 現在 ? 現在.電池 : null };
  $("本体").innerHTML = `<h1>体と気分</h1><p class="小">今の状態を入れると、提案が変わります。入れなくてもかまいません。${s.使い回す時間_時間}時間は、使い回します。</p>
    <div class="カード">${現在 ? `いまの入力：体${現在.体}%・気分${現在.気分}${現在.電池 !== null ? "・電池" + 現在.電池 + "%" : ""}（${現在.日時.slice(11, 16)}）` : "いま使える入力は、ありません（体100%・気分ふつうとして計算）"}</div>
    <h2>体</h2><div class="選択" id="体">${刻む(s.体の刻み).map(v => `<button data-v="${v}">${v}%</button>`).join("")}</div>
    <h2>気分</h2><div class="選択" id="気分">${s.気分の選択肢.map(v => `<button data-v="${v}">${v}</button>`).join("")}</div>
    <h2>電池（なくてもよい）</h2><div class="選択" id="電池">${刻む(s.電池の刻み).map(v => `<button data-v="${v}">${v}%</button>`).join("")}</div>
    <button class="押す 濃" id="保存ボタン">保存</button> <span id="通知"></span>`;
  for (const 種 of ["体", "気分", "電池"]) {
    const 印 = () => $(種).querySelectorAll("button").forEach(b => b.classList.toggle("選ばれ", String(選ぶ[種]) === b.dataset.v));
    $(種).onclick = e => { const b = e.target.closest("button"); if (!b) return; 選ぶ[種] = 種 === "気分" ? b.dataset.v : Number(b.dataset.v); if (種 === "電池" && false) 選ぶ[種] = null; 印(); }; 印();
  }
  $("保存ボタン").onclick = () => { try { L.状態を記録(データ, 設定, 選ぶ.体, 選ぶ.気分, 選ぶ.電池); 保存(); 状態画面(); setTimeout(() => 出す("保存しました"), 0); } catch (e) { 出す(選ぶ.体 === null || 選ぶ.気分 === null ? "体と気分を選んでください" : e.message, true); } };
}

// ================= タスク =================
function タスク画面(直す = null) {
  const 柱A = 設定.柱A, 生 = L.生きている(データ.tasks).filter(x => !x.倉庫), t = 直す ? 生.find(x => x.id === 直す) : null;
  const 名 = Object.fromEntries(柱A.タスクの種類.map(x => [x.キー, x.名前]));
  $("本体").innerHTML = `<h1>タスク</h1><div class="カード"><b>${t ? "直す" : "足す"}</b>
    <label>内容</label><input id="内容" value="${安全(t?.内容)}">
    <label>種類</label><select id="種類">${柱A.タスクの種類.map(x => `<option value="${安全(x.キー)}">${安全(x.名前)}</option>`).join("")}</select>
    <div id="締切欄"><label>締切（日付と時刻）</label><input id="締切" type="datetime-local"></div>
    <div id="間隔欄"><label>何日おき</label><input id="間隔日" type="number" min="1" inputmode="numeric"></div>
    <label>重要度（${柱A.重要度の範囲[0]}〜${柱A.重要度の範囲[1]}）</label><input id="重要度" type="number" inputmode="numeric" value="5">
    <label>楽しさの印</label><select id="楽しさ">${柱A.楽しさの印.map(x => `<option>${x}</option>`).join("")}</select>
    <label>画面を使う？（電池が少ない時は、使わない物だけ出します）</label><select id="画面"><option value="true">使う</option><option value="false">使わない</option></select>
    <label>見積もり（分）</label><input id="見積もり" type="number" inputmode="numeric" value="30">
    <button class="押す 濃" id="送る">${t ? "保存" : 言("追加ボタン")}</button>${t ? '<button class="押す" id="やめる">やめる</button>' : ""} <span id="通知"></span></div>
    <h2>いまのタスク（${生.length}件）</h2><div class="カード" id="一覧"></div>`;
  const 切替 = () => { $("締切欄").style.display = $("種類").value === "締切" ? "" : "none"; $("間隔欄").style.display = $("種類").value === "継続" ? "" : "none"; };
  $("種類").onchange = 切替;
  if (!t && 取っておく内容) { $("内容").value = 取っておく内容; 取っておく内容 = null; }
  if (!t && 取っておく下書き) { $("種類").value = 取っておく下書き.種類; $("締切").value = 取っておく下書き.締切; 取っておく下書き = null; }
  if (t) { $("種類").value = t.種類; $("締切").value = t.締切 || ""; $("間隔日").value = t.間隔日 || ""; $("重要度").value = t.重要度; $("楽しさ").value = t.楽しさの印; $("画面").value = String(t.画面を使う !== false); $("見積もり").value = t.見積もり分; }
  切替();
  const 数 = id => $(id).value === "" ? null : Number($(id).value);
  $("送る").onclick = () => {
    const 入力 = { 内容: $("内容").value, 種類: $("種類").value, 締切: $("締切").value, 間隔日: 数("間隔日"), 重要度: 数("重要度"), 楽しさの印: $("楽しさ").value, 画面を使う: $("画面").value === "true", 見積もり分: 数("見積もり") };
    try { t ? L.タスクを直す(データ, 設定, t.id, 入力) : L.タスクを足す(データ, 設定, 入力); 保存(); タスク画面(); setTimeout(() => 出す(t ? 言("直した後") : 言("追加した後")), 0); } catch (e) { 出す(e.message, true); }
  };
  if (t) $("やめる").onclick = () => タスク画面();
  $("一覧").innerHTML = 生.length ? "" : '<span class="小">まだ、ありません</span>';
  for (const x of 生) {
    const 行 = document.createElement("div"); 行.className = "タスク行";
    行.innerHTML = `<div><b></b><br><span class="小"></span></div><div class="行ボタン"><button>達成</button><button>分ける</button><button>${安全(言("直すボタン"))}</button><button>${安全(言("消すボタン"))}</button></div>`;
    行.querySelector("b").textContent = x.内容;
    行.querySelector(".小").textContent = `${名[x.種類] || x.種類}・重要度${x.重要度}・${x.楽しさの印}・${x.見積もり分}分` + (x.締切 ? "・" + x.締切.replace("T", " ") : "") + (x.間隔日 ? "・" + x.間隔日 + "日おき" : "") + (x.画面を使う === false ? "・画面なし" : "");
    const [達, 分, 直, 消] = 行.querySelectorAll("button");
    分.onclick = () => 分解を出す(x);
    達.onclick = () => { if (confirm("「" + x.内容 + "」を達成にしますか？（+5点。締切のタスクは、一覧から外れます）")) { L.達成する(データ, x.id); 保存(); 節目を送る("達成"); タスク画面(); setTimeout(() => { 出す("達成にしました（気分の点数 " + L.生活の状態(データ, 設定).点数 + "）"); 時間を聞く(x); }, 0); } };
    直.onclick = () => { タスク画面(x.id); window.scrollTo(0, 0); };
    消.onclick = () => { if (confirm("「" + x.内容 + "」" + 言("消す前の確認"))) { L.タスクを消す(データ, x.id); 保存(); タスク画面(); setTimeout(() => 出す(言("消した後")), 0); } };
    $("一覧").appendChild(行);
  }
}

// ================= カレンダー（締切型タスクの締切を、月の表に並べる） =================
let 暦の年 = 0, 暦の月 = 0, 暦の日 = "";
// ---- Googleカレンダー（読む・［LP］予定を書く）。予定の中身は、この端末の中だけに置く（同期ファイルには入れない）----
const クライアントID = () => { try { return localStorage.getItem("lifepilot_clientid") || 既定のクライアントID; } catch (e) { return 既定のクライアントID; } };
let G予定 = (() => { try { return JSON.parse(localStorage.getItem("lifepilot_gcal") || "null"); } catch (e) { return null; } })();      // { 取得: "…", 予定: [{id, summary, start, end, status, transparency, lp}] }
const G保存 = () => { try { localStorage.setItem("lifepilot_gcal", JSON.stringify(G予定)); } catch (e) {} };
async function Googleへつなぐ() {
  const 状 = t => { const e = $("G状態"); if (e) e.textContent = t; };
  try {
    状("Google に問い合わせています…");
    const C = LifePilotCalendar, 今 = new Date(), 設 = L.カレンダー設定(設定), トークン = await C.通行証(クライアントID());
    const 読み始め = new Date(今.getFullYear(), 今.getMonth() - 1, 1), 読み終わり = new Date(今.getFullYear(), 今.getMonth() + 3, 1);
    const 先 = new Date(今.getTime() + 設.反映の先読み日数 * 86400000);
    const LP既存 = await C.読む(トークン, new Date(今.getTime() - 30 * 86400000), 先, true);                       // 自分が作った予定だけ（先読みの範囲ぜんぶ）
    const 差 = L.予定の差(L.望む予定(データ, 設定, 今, Intl.DateTimeFormat().resolvedOptions().timeZone), LP既存, 今), 件 = 差.作る.length + 差.直す.length + 差.消す.length;
    if (件 && confirm("Googleカレンダーに、［LP］の予定を反映します。\n作る " + 差.作る.length + "件・直す " + 差.直す.length + "件・消す " + 差.消す.length + "件（ふだんの予定は、触りません）。よろしいですか？")) {
      const r = await C.反映する(トークン, 差); 状("反映しました（作った " + r.作った + "・直した " + r.直した + "・消した " + r.消した + "）。");
    } else 状(件 ? "反映は、見送りました。" : "反映する物は、ありませんでした（すでに最新です）。");
    const 予定 = await C.読む(トークン, 読み始め, 読み終わり);
    G予定 = { 取得: L.時刻文字(new Date()), 予定: 予定.map(e => ({ id: e.id, summary: e.summary || "（題なし）", start: e.start, end: e.end, status: e.status, transparency: e.transparency, lp: ((e.extendedProperties || {}).private || {}).lifepilot === "1" })) };
    G保存(); setTimeout(() => { カレンダー画面(); const e = $("G状態"); if (e) e.textContent = "読み込みました（" + G予定.予定.length + "件）。"; }, 0);
  } catch (e) { 状(e.message); }
}
function Gの予定(日付) {
  if (!G予定) return [];
  return G予定.予定.filter(e => ((e.start || {}).dateTime || (e.start || {}).date || "").slice(0, 10) === 日付 || ((e.start || {}).date && (e.start.date <= 日付 && (e.end || {}).date > 日付)));
}

  $("筋今週").textContent = "今週の鍛錬場の灯り：" + "●".repeat(様.今週) + "○".repeat(Math.max(0, 様.目標 - 様.今週)) + (様.最後 ? "（最後：" + 様.最後 + "）" : "");
  for (const r of 最近) {
    const p = document.createElement("p"); p.className = "小"; p.textContent = r.日時.slice(0, 16) + (r.メモ ? "　" + r.メモ : "") + "　";
    const b = document.createElement("button"); b.className = "押す"; b.textContent = "取り消す";
    b.onclick = () => { if (!confirm("この記録を取り消しますか")) return; try { L.筋トレを取り消す(データ, r.id); 保存(); 筋トレ画面(); } catch (e) { 出す(e.message, true); } };
    p.appendChild(b); $("筋最近").appendChild(p);
  }
  if (!最近.length) $("筋最近").innerHTML = '<p class="小">まだ、ありません</p>';
  $("筋やった").onclick = () => {
    try { L.筋トレをやった(データ, 設定, $("筋メモ").value); 保存(); 節目を送る("筋トレ"); 筋トレ画面(); setTimeout(() => 出す("記録しました。通信に、リラから一言が届きます。"), 0); } catch (e) { 出す(e.message, true); }
  };
}

// ---- 街の地図（小説の世界。絵と決まりは core.js。Mac の /city と同じ） ----
function 街画面() {
  let ニュース = [], 同期 = null;
  try { ニュース = JSON.parse(localStorage.getItem("lifepilot_news") || "[]"); } catch (e) {}
  try { const x = JSON.parse(localStorage.getItem("lifepilot_lastsync") || "null"); if (x && x.日時) 同期 = x.日時 + ":00"; } catch (e) {}
  const 様 = L.街の様子(L.街の材料(データ, 設定, new Date(), { ニュース: ニュース.filter(r => !r.反応).length, 同期 }), 設定);
  $("本体").innerHTML = `<h1>街の地図</h1><div class="カード"><b>エルピー：</b><span id="街の一言"></span></div><div id="街"></div><div class="カード" id="街の説明"><span class="小">地区を押すと、その場所の様子と、つながる画面が出ます。</span></div>`;
  $("街の一言").textContent = 様.一言; const 絵 = window.LifePilotArt街; $("街").innerHTML = 絵 && 絵.絵の街を描く ? 絵.絵の街を描く(様) : (絵 || L).街を描く(様);
  for (const g of document.querySelectorAll(".地区")) g.onclick = () => {
    const x = L.街の説明(g.dataset.k, 様), 枠 = $("街の説明");
    枠.innerHTML = "<b></b><p></p><div></div>"; 枠.children[0].textContent = x.題; 枠.children[1].textContent = x.文;
    for (const [名, , 画] of x.行き先) if (画) { const b = document.createElement("button"); b.className = "押す"; b.textContent = 名 + "へ"; b.onclick = () => 移る(画); 枠.children[2].appendChild(b); }
  };
}
