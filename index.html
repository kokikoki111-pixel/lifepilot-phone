<script>
// ================= データ（スマホの中に、持つ） =================
const L = LifePilot, $ = id => document.getElementById(id);
const 既定のクライアントID = "207746409667-k82tseegkc8ufkm9jj1ddam877mmj8tn.apps.googleusercontent.com";   // Google の「名前札」。秘密ではない
const 空データ = () => ({ tasks: [], deposits: [], state_logs: [], seals: [], suggestion_log: [], focus_log: [], memos: [], life_events: [], sleep_logs: [], warehouse_items: [], wishlist: [], duration_log: [], workout_logs: [], ai_requests: [], ai_replies: [], class_notes: [], values: { 答え: {}, 今日はやめた: {} } });
let データ = 空データ(), 設定 = null, 画面 = (decodeURIComponent(location.hash.slice(1)) || "提案"), 時計 = null, 今の提案 = null, 今の空き = 0, 五分の記録 = null;
function 保存() { try { localStorage.setItem("lifepilot_data", JSON.stringify(データ)); } catch (e) { const 文 = "保存できませんでした（保存先がいっぱいか、使えない設定です）"; if ($("通知")) 出す(文, true); else alert(文); } }
function 読み込む() { try { const s = localStorage.getItem("lifepilot_data"); if (s) データ = Object.assign(空データ(), JSON.parse(s)); } catch (e) { try { localStorage.setItem("lifepilot_data_broken", localStorage.getItem("lifepilot_data")); } catch (e2) {} データ = 空データ(); alert("記録が読めませんでした。壊れた記録は lifepilot_data_broken に残しました"); } }
async function 設定を読む() {

}
async function エルピーの設定を補う() {          // 古い設定（新しい項目がない）の時は、初めの設定から、足りない項目だけ足す
  const 要る = ["エルピー", "倉庫", "相場帳", "分解", "カレンダー", "通信", "実験室", "街", "コーチ", "自由コーチ", "見た目", "思考の種", "練習"];
  const 揃う = () => 要る.every(k => 設定[k]) && (設定.コーチ || {}).最初の一手 && 設定.通信 && 設定.通信.節目.筋トレ && 設定.街 && 設定.街.段階 && 設定.街.機能の木 && 設定.街.一言.筋トレ && 設定.見た目 && 設定.通信.人.友人 && 設定.柱B.週末に出す種類 && 設定.柱B.預ける種類.includes("思考");

    for (const k of ["筋トレ", "筋トレの間"]) if (設定.通信 && !設定.通信.節目[k]) 設定.通信.節目[k] = 初.通信.節目[k];
    if (設定.街 && !設定.街.一言.筋トレ) 設定.街.一言.筋トレ = 初.街.一言.筋トレ;
    for (const k of ["友人の上限", "友人の上限の文"]) if (設定.通信 && 設定.通信[k] === undefined) 設定.通信[k] = 初.通信[k];
    if (設定.通信 && !設定.通信.人.友人) { 設定.通信.人.友人 = 初.通信.人.友人; 設定.通信.困った時.友人 = 初.通信.困った時.友人; }
    for (const k of ["段階", "機能の木"]) if (設定.街 && 設定.街[k] === undefined) 設定.街[k] = 初.街[k];
    for (const k of ["週末に出す種類", "古い声の日数", "拠り所を出す体の値"]) if (設定.柱B[k] === undefined) 設定.柱B[k] = 初.柱B[k];
    for (const t of 初.柱B.預ける種類) if (!設定.柱B.預ける種類.includes(t)) 設定.柱B.預ける種類.push(t); } catch (e) {}
}
const 言 = k => (設定.整備室.表示の言葉 || {})[k] || k;
function このスマホの動き() { try { return localStorage.getItem("lifepilot_motion") || ""; } catch (e) { return ""; } }
function 動きを当てる() {          // 背景の動き（多い／少ない／なし）。テーマ.css の 14b が見る
  const v = このスマホの動き() || "少ない";          // スマホは、何も選んでいない時は「少ない」（熱くなる・遅くなる対策。Mac の設定には従わない。同期の画面で、選べる）
  document.body.dataset.動き = document.documentElement.dataset.動き = ["多い", "少ない", "なし"].includes(v) ? v : "少ない";
}
function 出す(文, エラー) { const e = $("通知"); if (e) { e.className = エラー ? "エラー" : "完了"; e.textContent = 文; } }
const 安全 = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ================= 画面の切り替え =================
const 画面一覧 = [["提案", "今なにする？"], ["エルピー", "エルピー"], ["街", "街の地図"], ["筋トレ", "筋トレ"], ["使った", "使った機能"], ["タスク", "タスク"], ["カレンダー", "カレンダー"], ["メモ", "メモ"], ["ノート", "授業ノート"], ["預ける", "預ける"], ["引く", "記録を引く"], ["夜", "明日何やる？"], ["ニュース", "ニュース"], ["倉庫", "倉庫"], ["通信", "通信"], ["実験室", "実験室"], ["状態", "体と気分"], ["同期", "同期"]];
const 隠す画面 = { "ニュース": "ニュース", "使った機能": "使った", "街の地図": "街", "実験室": "実験室" };      // 隠す機能の名前 → 画面（消さない。☰ とタブから見えなくするだけ。直に開けば使える）
function 隠れた画面() { return L.隠す機能(設定).map(名 => 隠す画面[名]); }
function 描く() {
  clearInterval(時計); document.body.dataset.画面 = 画面;          // 画面ごとの色・札は、この印で選ぶ（テーマ.css。:has() は重いので使わない）
  const 隠れ = 隠れた画面(), 主な = ["提案", "タスク", "街", "メモ"].filter(k => !隠れ.includes(k)), 未 = 未読の数();           // 下のタブは、よく使う4つ＋「その他」。全部の機能は、右上の ☰ か「その他」か、街の地図から
  $("タブ").innerHTML = 画面一覧.filter(([k]) => 主な.includes(k)).map(([k, 名]) => `<button class="${k === 画面 ? "今" : ""}" onclick="移る('${k}')">${名}</button>`).join("")
    + `<button class="${主な.includes(画面) ? "" : "今"}" onclick="メニューを開く()">${主な.includes(画面) ? "その他" : (画面一覧.find(x => x[0] === 画面) || [0, "その他"])[1]}${未 ? "（" + 未 + "）" : ""} ☰</button>`;
  ({ 提案: 提案画面, エルピー: エルピー画面, 街: 街画面, 筋トレ: 筋トレ画面, 使った: 使った機能画面, タスク: () => タスク画面(), カレンダー: カレンダー画面, メモ: メモ画面, ノート: ノート画面, 預ける: 預ける画面, 引く: 引く画面, 夜: 夜画面, ニュース: ニュース画面, 倉庫: 倉庫画面, 通信: 通信画面, 実験室: 実験室画面, 状態: 状態画面, 同期: 同期画面 })[画面]();
  const 本 = $("本体"); 本.classList.remove("n-現れる"); void 本.offsetWidth; 本.classList.add("n-現れる");   // タブを替えた時だけ、現れ方の動き（見た目の型 13節）
  setTimeout(() => { 本.classList.remove("n-現れる"); if (!本.className) 本.removeAttribute("class"); }, 800);
}
let 同期中 = false;
// ================= 機能の切り替え（右上の ☰・下の「その他」から開く全画面メニュー） =================
const メニュー群 = [
  ["ACTION ・ 行動", [["提案", "今なにする？", "空いた時間の一手"], ["タスク", "タスク", "足す・直す・分ける"], ["カレンダー", "カレンダー", "締切と空き時間"], ["筋トレ", "筋トレ", "鍛錬場"], ["夜", "明日何やる？", "夜に朝の5分を決める"]]],
  ["ARCHIVE ・ 記録", [["メモ", "メモ", "欲しい物・やりたい事"], ["ノート", "授業ノート", "写真の文字を貼って残す"], ["預ける", "預ける", "一言と受け取り箱"], ["引く", "記録を引く", "過去の記録を探す"], ["倉庫", "倉庫", "買取・解体・焼却"]]],
  ["CITY ・ 街", [["街", "街の地図", "地区から機能へ"], ["エルピー", "エルピーの窓", "点数と睡眠"], ["通信", "通信", "リラとパーシー"], ["ニュース", "ニュース", "気になる情報"], ["実験室", "実験室", "15分の小さな実験"]]],
  ["SYSTEM ・ 整備", [["状態", "体と気分", "いまの調子"], ["使った", "使った機能", "使った日の表"], ["同期", "同期", "Drive・背景の動き"]]]];
function メニューを開く() {
  const m = $("メニュー"), 未 = 未読の数();
  m.innerHTML = `<div class="メニュー頭"><b>機能を選ぶ</b><button class="メニュー閉じる" aria-label="閉じる">✕</button></div>` + メニュー群.map(([組, 項]) => `<div class="メニュー組"><div class="メニュー組名">${組}</div><div class="メニュー格子">${項.filter(([k]) => !隠れた画面().includes(k)).map(([k, 名, 説]) => `<button class="メニュー項${k === 画面 ? " 今" : ""}" data-k="${k}"><span class="名">${名}${k === "通信" && 未 ? "（" + 未 + "）" : ""}</span><span class="説">${説}</span></button>`).join("")}</div></div>`).join("") + 隠す機能の欄();
  m.hidden = false; document.body.style.overflow = "hidden";
  m.querySelector(".メニュー閉じる").onclick = メニューを閉じる;
  m.onclick = e => { const 切 = e.target.closest("[data-隠す]"); if (切) { L.隠す機能を切り替える(設定, 切.dataset.隠す, 切.dataset.する === "1"); try { localStorage.setItem("lifepilot_settings", JSON.stringify(設定)); } catch (x) {} 描く(); return メニューを開く(); }
    const b = e.target.closest(".メニュー項"); if (b) { メニューを閉じる(); 移る(b.dataset.k); } else if (e.target === m) メニューを閉じる(); };
  const 今 = m.querySelector(".メニュー項.今") || m.querySelector(".メニュー項"); if (今) 今.focus();
}
function 隠す機能の欄() {          // ☰ の下。隠す／見せるを、ひとつずつ戻せる（Mac の機能の棚と同じ）
  const 隠す = L.隠す機能(設定);
  return `<div class="メニュー組"><div class="メニュー組名">HIDE ・ 見せる／隠す</div><div class="メニュー格子">${L.隠せる機能.map(名 => `<button class="メニュー項" data-隠す="${名}" data-する="${隠す.includes(名) ? 0 : 1}"><span class="名">${名}：${隠す.includes(名) ? "隠している" : "見せている"}</span><span class="説">${隠す.includes(名) ? "押すと、メニューに戻す" : "押すと、メニューから隠す（記録は消えません）"}</span></button>`).join("")}</div></div>`;
}
function メニューを閉じる() { $("メニュー").hidden = true; document.body.style.overflow = ""; }
$("メニュー鈕").onclick = メニューを開く;
addEventListener("keydown", e => { if (e.key === "Escape" && !$("メニュー").hidden) メニューを閉じる(); });
// ================= 起動時のアンケート（見出し・体・気分・睡眠・価値観2問。1日1回。どの項目も飛ばせる） =================
function 起動アンケート() {
  const 今日 = new Date(), 日 = 今日.getFullYear() + "-" + String(今日.getMonth() + 1).padStart(2, "0") + "-" + String(今日.getDate()).padStart(2, "0");
  try { if (sessionStorage.getItem("lp_アンケート済") || localStorage.getItem("lp_アンケート日") === 日) return; } catch (e) {}
  if (((設定.土台2 || {}).起動アンケート) === false || L.休会中(データ) || L.復帰の材料(データ, 設定)) return;      // 休会中・復帰画面では聞かない
  try { sessionStorage.setItem("lp_アンケート済", "1"); } catch (e) {}
  const 体気分済 = !!L.使える状態(データ, 設定), 睡眠が要る = !!L.生活の状態(データ, 設定).睡眠の質問;
  if (体気分済 && !睡眠が要る) return;                                                    // 6時間以内の入力があり、睡眠も答え済みなら、聞かない
  const 選び = { 体: null, 気分: null, 睡眠: undefined, 大事: null }, 要素 = document.createElement("div");
  要素.id = "起動アンケート"; 要素.setAttribute("role", "dialog");
  const ボタン = (k, 一覧) => `<div class="選択" data-k="${k}">${一覧.map(([v, 名]) => `<button data-v="${安全(String(v))}">${安全(名)}</button>`).join("")}</div>`;
  要素.innerHTML = `<div class="カード"><b>おかえり。今日の調子は？</b><p class="小">答えなくても大丈夫。あとでも、いつでも。当てはまらない所は、飛ばしてください。</p>
    ${体気分済 ? "" : `<label>からだは、どのくらい動きそう？</label>${ボタン("体", [20, 40, 60, 80, 100].map(v => [v, v + "%"]))}
    <label>気分は？</label>${ボタン("気分", ((設定.土台2 || {}).気分の選択肢 || []).map(v => [v, v]))}`}
    ${睡眠が要る ? `<label>昨夜は、何時間ほど眠れた？</label>${ボタン("睡眠", [[3, "3時間以下"], [4, "4時間"], [5, "5時間"], [6, "6時間"], [7, "7時間"], [8, "8時間"], [9, "9時間"], [10, "10時間以上"], ["", "わからない"]])}` : ""}
    <label>今日いちばん大事にしたいのは？</label>${ボタン("大事", ["休む", "進める", "整える", "楽しむ"].map(v => [v, v]))}
    <input id="アンケ一言" class="入力" placeholder="ひとこと（書きたい時だけ）" maxlength="80">
    <label>今の自分に、足りない気がするのは？</label>
    <input id="アンケ足りない" class="入力" placeholder="書きたい時だけ" maxlength="120">
    <div class="行ボタン"><button class="押す 濃" id="アンケ保存">記録する</button><button class="押す" id="アンケ飛ばす">今日は答えない</button></div><p id="アンケ通知" class="小"></p></div>`;
  document.body.appendChild(要素);
  const 閉じる = () => { try { localStorage.setItem("lp_アンケート日", 日); } catch (e) {} 要素.remove(); };
  要素.onclick = e => { const b = e.target.closest(".選択 button"); if (!b) return; const 枠 = b.parentElement, k = 枠.dataset.k; 枠.querySelectorAll("button").forEach(x => x.classList.remove("選ばれ")); b.classList.add("選ばれ"); 選び[k] = k === "体" ? Number(b.dataset.v) : k === "睡眠" ? (b.dataset.v === "" ? null : Number(b.dataset.v)) : b.dataset.v; };
  $("アンケ飛ばす").onclick = 閉じる;
  $("アンケ保存").onclick = () => {
    try {
      if ((選び.体 === null) !== (選び.気分 === null)) throw new Error("体と気分は、両方選ぶか、両方飛ばしてください");
      if (選び.体 !== null) L.状態を記録(データ, 設定, 選び.体, 選び.気分, null);
      if (選び.睡眠 !== undefined) L.睡眠を答える(データ, 選び.睡眠);
      const 一言 = $("アンケ一言").value.trim(), 足りない = $("アンケ足りない").value.trim();
      データ.values = データ.values || { 答え: {}, 今日はやめた: {} };
      if (選び.大事 || 一言) データ.values.答え["今日の大事_" + 日] = L.更新印({ 選択: 選び.大事, 一言, 更新日: 日 });
      if (足りない) データ.values.答え["足りない_" + 日] = L.更新印({ 選択: null, 一言: 足りない, 更新日: 日 });
      保存(); 閉じる(); if (画面 === "提案") 提案画面();
    } catch (e) { $("アンケ通知").textContent = e.message; }
  };
}
function 移る(k) { if (同期中) return 出す("同期が終わるまで、お待ちください", true); if (五分の記録 && 時計 && !confirm("5分だけの途中です。移ると、計るのが止まります。移りますか")) return; 画面 = k; 描く(); }

// ================= エルピー（生活の点数と、睡眠のアンケート） =================
let 答え直し = false;
function エルピー画面() {
  L.開く(データ); 保存();                                     // ログイン・昨日までの放置・締切切れ（何度でも同じ）
  const s = L.生活の状態(データ, 設定), e = 設定.エルピー, g = e.生活, t = s.今日, 見 = s.見せる;           // 見＝点数と顔を見せるか（既定はオフ。睡眠の入力と疲れは、いつでも出す）

function メモを書く画面(m, 種類) {

function 読み上げる(文, 言語) {

function 没頭タイマー(分, 終わった) {
  const 幕 = document.createElement("div");
  幕.style.cssText = "position:fixed;inset:0;z-index:100000;background:#000;color:#222;display:flex;align-items:center;justify-content:center;font:14px sans-serif;cursor:pointer";
  幕.textContent = "画面を伏せてください（やめる時は、タップ）";
  document.body.appendChild(幕);
  let 画面を保つ = null; try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => 画面を保つ = w).catch(() => {}); } catch (e) {}
  const 終点 = Date.now() + 分 * 60000;
  const 片付ける = () => { clearInterval(刻); try { 画面を保つ && 画面を保つ.release(); } catch (e) {} 幕.remove(); };
  const 鳴らす = () => { try { const c = new (window.AudioContext || window.webkitAudioContext)(); [0, .6, 1.2].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 660; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.3, c.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t + .5); o.start(c.currentTime + t); o.stop(c.currentTime + t + .5); }); } catch (e) {} };
  const 刻 = setInterval(() => { if (Date.now() >= 終点) { 片付ける(); 鳴らす(); 終わった(true); } }, 1000);
  幕.onclick = () => { 片付ける(); 終わった(false); };
}

function 節目を送る(キー) {

    const e = L.節目の文(設定, キー, L.通信の状況(データ, 設定)), 今 = Date.now();
    if (最後の節目[e.送り手] && 今 - 最後の節目[e.送り手] < (設定.通信.重ね禁止秒 || 5) * 1000) return;
    最後の節目[e.送り手] = 今;
    const 一覧 = 通信を読む(), 日 = L.日付文字(new Date());
    if (一覧.some(r => r.日時.startsWith(日) && r.出所 === キー && (キー === "朝" || r.本文 === e.本文))) return;      // 同じ日の朝・同じ文の通知は、まとめて1件
    一覧.push({ 日時: L.時刻文字(new Date()), 送り手: e.送り手, 本文: e.本文, 出所: キー, 既読: 画面 === "通信" }); 通信を書く(一覧);
  } catch (x) {}
}
function 起動の節目(報告) {
  const 今日 = L.日付文字(new Date());
  if (!通信を読む().some(r => r.出所 === "朝" && r.日時.startsWith(今日))) 節目を送る("朝");
  if (報告 && 報告.締切切れ) 節目を送る("締切切れ");             // 朝＝リラ、締切切れ＝パーシー（送り手が違うので、重ならない）
  const s = (設定.自由コーチ || {}).筋トレ;
  if (s && s.使う && 設定.通信 && 設定.通信.節目.筋トレの間) {      // 筋トレの間が空いたら、パーシーが一度だけ（重ならないよう、少し後で）
    const 促した = 通信を読む().filter(r => r.出所 === "筋トレの間").map(r => r.日時).sort().pop() || null;
    if (L.筋トレの様子(データ.workout_logs || [], s, new Date(), 促した).促す) setTimeout(() => 節目を送る("筋トレの間"), 6000);

}

  if (!id) return 出す("先に、Google のクライアントIDを入れてください", true);
  try { localStorage.setItem("lifepilot_clientid", id); } catch (e) {}
  $("同期ボタン").disabled = true; 同期中 = true; 出す("同期しています…");
  try {
    const ドライブ = await LifePilotDrive.ドライブを作る(id);
    const r = await L.同期を実行(ドライブ, データ);
    データ = Object.assign(空データ(), r.新しいデータ); 保存();
    if (r.設定) { 設定 = r.設定; await エルピーの設定を補う(); 動きを当てる(); try { localStorage.setItem("lifepilot_settings", JSON.stringify(設定)); } catch (e) {} }
    if (r.ニュース) { try { localStorage.setItem("lifepilot_news", JSON.stringify(r.ニュース)); } catch (e) {} }
    let 見た = []; try { 見た = JSON.parse(localStorage.getItem("lifepilot_ai_shown") || "[]"); } catch (e) {}
    const 届 = L.通信のAIを使う(設定) ? L.届いた返事(データ, 見た) : [];
    if (届.length) { const 一覧 = 通信を読む(); for (const x of 届) 一覧.push({ 日時: x.日時, 送り手: x.相手, 本文: x.本文, 出所: "Macの返事", 既読: false }); 通信を書く(一覧);
      try { localStorage.setItem("lifepilot_ai_shown", JSON.stringify(見た.concat(届.map(x => x.id)).slice(-500))); } catch (e) {} }
    const 文 = (r.報告.入った ? "相手から " + r.報告.入った + "件が入りました" : "新しく入った物は、ありませんでした") + (届.length ? "。Mac の AI の返事が " + 届.length + " 件、通信に届きました" : "");
    try { localStorage.setItem("lifepilot_lastsync", JSON.stringify({ 日時: L.時刻文字(new Date()).slice(0, 16), 文 })); } catch (e) {}
    同期中 = false; 同期画面(); setTimeout(() => 出す("同期しました。" + 文), 0);
  } catch (e) { 同期中 = false; $("同期ボタン").disabled = false; 出す(e.message, true); }
}

// ---- 記録を引く（預けた記録を、そのまま探す。AIは使わない） ----
function 引く画面() {
  $("本体").innerHTML = `<h1>記録を引く</h1><p class="小">預けた記録を、そのまま探します。言葉は、スペースで区切ると、すべてを含む物だけを出します。</p>
    <div class="カード"><label>言葉</label><input id="引く言葉"><label>預けた日（から）</label><input id="引く開始" type="date"><label>（まで）</label><input id="引く終了" type="date">
    <label>種類</label><select id="引く種類"><option value="">（すべて）</option>${設定.柱B.預ける種類.map(x => `<option>${安全(x)}</option>`).join("")}<option>通信</option></select>
    <label><input type="checkbox" id="引く通信" ${設定.柱B.記録を引くに通信を入れる ? "checked" : ""}> 通信に自分が書いた言葉も探す（相手の返事は、探しません）</label>
    <button class="押す 濃" id="引くボタン">引く</button><p id="通知"></p></div><p class="小" id="引く件数"></p><div id="引く結果"></div>`;
  const 出す結果 = () => {
    let 件; try { 件 = L.記録を引く(データ, $("引く言葉").value, $("引く開始").value || null, $("引く終了").value || null, $("引く種類").value || null, 設定, $("引く通信").checked || $("引く種類").value === "通信"); } catch (e) { return 出す(e.message, true); }
    出す(""); $("引く結果").innerHTML = "";
    for (const x of 件) {
      const 行 = document.createElement("div"); 行.className = "カード"; 行.innerHTML = `<span class="小"></span><p style="white-space:pre-wrap"></p>`;
      行.children[0].textContent = x.日付.slice(0, 16) + (x.種類 ? "　" + x.種類 : "") + (x.返す日 ? "　返す日 " + x.返す日 : "") + (x.反応 ? "　反応：" + x.反応 : "");
      行.children[1].textContent = x.本文 + (x.書き直した文 ? "\n（書き直した後：" + x.書き直した文 + "）" : ""); $("引く結果").appendChild(行);
    }
    const n = $("引く結果").children.length; $("引く件数").textContent = n ? n + "件" : "見つかりませんでした。";      // 件数は、画面に並んだ数を数える
  };
  $("引くボタン").onclick = 出す結果; $("引く言葉").onkeydown = e => { if (e.key === "Enter") 出す結果(); }; 出す結果();
}

// ---- 筋トレ（自由コーチ。声かけと、街の鍛錬場だけ。数字の評価はしない） ----
function 筋トレ画面() {
  const s = (設定.自由コーチ || {}).筋トレ;
  if (!s) { $("本体").innerHTML = '<h1>筋トレ</h1><p class="小">筋トレの設定がありません。Mac と同期すると、使えます。</p>'; return; }
  const 様 = L.筋トレの様子(データ.workout_logs || [], s), 最近 = L.生きている(データ.workout_logs || []).slice(-10).reverse();
  $("本体").innerHTML = `<h1>筋トレ</h1><p class="小">コーチの役は、声かけと、街の鍛錬場だけです。回数や重さの評価はしません。</p>
    <div class="カード"><p id="筋目標"></p><p id="筋今週"></p><input id="筋メモ" maxlength="100" placeholder="メモ（なくてもよい）"><button class="押す 濃" id="筋やった">やった</button><p id="通知"></p></div>
    <div class="カード"><b>最近の記録</b><div id="筋最近"></div></div>`;
  $("筋目標").textContent = `${s.場所と道具}・${s.目的}：週${s.週の回数}回、${s.分}分`;
  $("筋今週").textContent = "今週の鍛錬場の灯り：" + "●".repeat(様.今週) + "○".repeat(Math.max(0, 様.目標 - 様.今週)) + (様.最後 ? "（最後：" + 様.最後 + "）" : "");
  for (const r of 最近) {
    const p = document.createElement("p"); p.className = "小"; p.textContent = r.日時.slice(0, 16) + (r.メモ ? "　" + r.メモ : "") + "　";
    const b = document.createElement("button"); b.className = "押す"; b.textContent = "取り消す";
    b.onclick = () => { if (!confirm("この記録を取り消しますか")) return; try { L.筋トレを取り消す(データ, r.id); 保存(); 筋トレ画面(); } catch (e) { 出す(e.message, true); } };
    p.appendChild(b); $("筋最近").appendChild(p);
  }
  if (!最近.length) $("筋最近").innerHTML = '<p class="小">まだ、ありません</p>';
  $("筋やった").onclick = () => {
    try { L.筋トレをやった(データ, 設定, $("筋メモ").value); 保存(); 節目を送る("筋トレ"); 筋トレ画面(); setTimeout(() => 出す("記録しました。通信に、リラから一言が届きます。"), 0); } catch (e) { 出す(e.message, true); }
  };
}

// ---- 街の段階と機能の木（Mac の /city と同じ。表示だけ） ----
function 段階と木を描く(段階枠, 木枠, x, 木) {

  段階枠.innerHTML = `<b>街の段階：${x.段階} ${安全(x.名前)}</b><div style="display:flex;gap:4px;margin:8px 0">${名.map((n, i) => `<div style="flex:1;text-align:center;padding:6px 0;border-radius:6px;font-size:12px;${i + 1 === x.段階 ? "background:#e0a84a;color:#111;font-weight:bold" : "background:rgba(255,255,255,.08)"}">${i + 1}<br>${n}</div>`).join("")}</div>
    <p class="小">${x.平均 === null ? "記録がまだ足りないので、始まりの段階です。" : "直近の平均：" + x.平均 + "点。"}1日や2日では動かず、数日かけてゆっくり変わります。${x.動いた.length ? "<br>最近の変化：" + 安全(x.動いた.slice(-3).map(([d, a, b]) => d.slice(5) + " " + a + "→" + b).join("　")) : ""}</p>`;
  木枠.innerHTML = "<b>機能の木</b><p class='小'>表示だけです。使うかどうかは、自分で決めます。●＝直近28日に使った　○＝まだ</p>" + 木.map(g => `<div style="margin:8px 0"><b class="小">${安全(g.段階)}</b>${g.機能.map(f => `<div class="小">${f.状態 === "使った" ? "●" : f.状態 === "まだ" ? "○" : "・"} ${安全(f.名前)}${f.最後 ? "（" + f.最後.slice(5) + "）" : ""}</div>`).join("")}</div>`).join("");
}
